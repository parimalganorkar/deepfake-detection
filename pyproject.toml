[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the repo root on sys.path so `core` and `api` import under a bare `pytest` call.
# Without this, only `python -m pytest` works (it adds CWD implicitly) and CI fails with
# ModuleNotFoundError during collection.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["env", "*.ipynb", "resnet50_report"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]  # line length handled by formatter; long HTML/CSS strings in app.py

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: File()/Depends()/Header() as argument defaults is intentional, not a bug.
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Header", "fastapi.Query"]

